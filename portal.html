<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>迷ったらここポータル</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-blue: #35a5db;
      --header-blue-dark: #2f9ed3;
      --deep-blue: #1651a8;
      --bg: #eef3f7;
      --text: #2d3a45;
      --sidebar-bg: #f5f7fa;
      --sidebar-border: #d4dee7;
      --card-shadow: 0 10px 18px rgba(31, 54, 74, 0.14);
    }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ===== サイドバー ===== */
    .sidebar {
      width: 230px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      transition: width 0.28s ease, transform 0.28s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar.collapsed {
      width: 0;
      border-right: none;
    }

    .sidebar-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      height: 50px;
      background: linear-gradient(90deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.15);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .sidebar-inner {
      padding: 24px 12px 16px;
      overflow-y: auto;
    }

    .sidebar-search-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #32506c;
      margin-bottom: 8px;
    }

    .sidebar-search-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sidebar-search-box input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 12px;
      border: 2px solid #dfa400;
      outline: none;
      background: #fff;
      color: #475864;
    }

    .sidebar-search-box button {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #25a4b0 0%, #1f95a1 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 5px 12px rgba(18, 92, 100, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .sidebar-search-results {
      min-height: 24px;
      font-size: 12px;
      line-height: 1.6;
      color: #4a6075;
      margin-bottom: 16px;
    }

    .search-result-list {
      display: grid;
      gap: 8px;
    }

    .search-result-item {
      background: #eaf4fb;
      border: 1px solid #cfe0ed;
      border-radius: 10px;
      padding: 10px 11px;
    }

    .search-result-item a {
      color: var(--deep-blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      word-break: break-word;
    }

    .search-result-item p {
      margin: 5px 0 0;
      font-size: 11px;
      line-height: 1.5;
      color: #557086;
      word-break: break-word;
    }

    .sidebar-links-title {
      margin: 0 0 10px;
      font-size: 12px;
      color: #70808d;
      font-weight: 700;
    }

    .sidebar-links {
      display: grid;
      gap: 8px;
    }

    .sidebar-link {
      display: block;
      padding: 10px 10px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #d7e1ea;
      color: #385069;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      word-break: break-word;
    }

    .sidebar-link:hover {
      background: #f0f7fc;
    }

    /* ===== メイン ===== */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

.topbar {
  height: 50px;
  background: linear-gradient(90deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: flex-start; /* ← ここを変更 */
  padding: 0 18px;
  gap: 14px;
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.18);
}
    
.topbar {
  justify-content: space-between;
}

/* 右側リンク全体 */
.topbar-links {
  display: flex;
  gap: 18px;
  align-items: center;
  margin-left: auto;
}

/* 各ボタン */
.top-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 10px;
  transition: 0.2s;
}

/* アイコン */
.top-link .icon {
  font-size: 18px;
  margin-bottom: 2px;
}

/* ホバー */
.top-link:hover {
  background: rgba(255,255,255,0.15);
}
    
    .menu-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .menu-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    .hamburger {
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
    }

    .topbar-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .container {
      width: min(94%, 1220px);
      margin: 25px auto 28px;
    }

    /* ===== 新着 ===== */
    .news-section {
      padding: 0;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.2;
      color: #6d7784;
      font-weight: 700;
    }

    .news-panel {
      display: grid;
      grid-template-columns: 4fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .news-main {
  background: #fff;
  border: 1px solid #cfd8df;
  height: 446px; /* 248px × 1.8 の目安 */
  padding: 8px 14px 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  border-radius: 14px;
  overflow-y: auto;
}

    .news-list {
      display: grid;
    }

    .news-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 14px;
  align-items: center;
  height: 48px;
  padding: 0 6px;
  border-bottom: 1px solid #d9e0e6;
  font-size: 14px;
}

    .news-item:last-child {
      border-bottom: none;
    }

    .news-date {
      color: #81909d;
      font-weight: 500;
    }

    .news-title {
  color: #334150;
  line-height: 1.45;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

    .news-tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #d3302f;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      vertical-align: middle;
    }

    .news-side {
      display: grid;
      gap: 10px;
    }

.side-box {
  min-height: auto;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
  border: 1px solid #ccd7e3;
  color: #46576a;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  box-shadow:
    0 1px 2px rgba(31, 54, 74, 0.04),
    inset 0 1px 0 rgba(255,255,255,0.8);
  padding: 10px 12px;
  border-radius: 12px;
}
.side-box {
  transition: all 0.2s ease;
  cursor: pointer;
}

.side-box:hover {
  transform: translateY(-3px);
  background: linear-gradient(180deg, #ffffff 0%, #e6edf5 100%);
  box-shadow:
    0 6px 14px rgba(31, 54, 74, 0.18),
    inset 0 1px 0 rgba(255,255,255,0.9);
}
    
    /* ===== カード ===== */
    .portal {
      padding: 24px 0 0;
    }

    .portal .section-title {
      margin: 0 0 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .card {
  position: relative;
  display: block;
  text-decoration: none;
  min-height: 96px;
  padding: 16px 18px 26px;
  color: #fff;
  overflow: hidden;
  clip-path: polygon(0 0, 100% 0, 100% 80%, 95% 100%, 0 100%);
  box-shadow: var(--card-shadow);
  border-radius: 12px;
}

    .card:hover {
  transform: translateY(-2px);
  transition: 0.2s ease;
}

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.02) 45%,
        rgba(0,0,0,0.06) 100%
      );
      pointer-events: none;
    }

    .card::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 12px;
  background: rgba(0,0,0,0.12);
}
    .card-content {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  position: relative;
  z-index: 1;
}
    .card-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: rgba(0,0,0,0.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  flex-shrink: 0;
}

    .card-text {
      min-width: 0;
      flex: 1;
    }

    .card h3 {
  margin: 0 0 6px;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
   .card p {
  margin: 0;
  font-size: 11px;
  line-height: 1.55;
  color: rgba(255,255,255,0.96);
}

    .card-link {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22px;
      display: grid;
      place-items: center;
      z-index: 1;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .c-teal   { background: linear-gradient(135deg, #45c3c8 0%, #2aa8ab 100%); }
    .c-coral  { background: linear-gradient(135deg, #f39a8d 0%, #e87469 100%); }
    .c-yellow { background: linear-gradient(135deg, #eccb42 0%, #d7aa1f 100%); }
    .c-blue   { background: linear-gradient(135deg, #7bb0e1 0%, #5f92c6 100%); }
    .c-purple { background: linear-gradient(135deg, #b589d7 0%, #9a6dc2 100%); }
    .c-green  { background: linear-gradient(135deg, #9dd45f 0%, #7dbb43 100%); }

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 920px) {
      .news-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .app {
        position: relative;
      }

      .sidebar {
        position: fixed;
        top: 72px;
        left: 0;
        bottom: 0;
        z-index: 30;
        width: 230px;
        box-shadow: 8px 0 20px rgba(0,0,0,0.12);
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
        width: 230px;
      }

      .container {
        width: 94%;
      }

      .news-item {
        grid-template-columns: 1fr;
        gap: 6px;
        font-size: 13px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 150px;
      }
    }
    .side-box.active {
  background: linear-gradient(180deg, #35a5db 0%, #2f9ed3 100%);
  color: #fff;
  box-shadow:
    0 6px 14px rgba(31, 54, 74, 0.25),
    inset 0 1px 0 rgba(255,255,255,0.3);
}
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-shell">
        <div class="sidebar-top">A beef...</div>

        <div class="sidebar-inner">
          <label class="sidebar-search-label" for="portalSearch">検索</label>
          <div class="sidebar-search-box">
            <input id="portalSearch" type="text" placeholder="例：請求書、顧客連絡、納品、広告運用" />
            <button id="clearSearch" type="button">検索をクリア</button>
          </div>

          <div id="searchResults" class="sidebar-search-results">
            　
          </div>

          <h3 class="sidebar-links-title">リンク一覧</h3>
          <div class="sidebar-links" id="sidebarLinks">
            <a href="#" class="sidebar-link">あとで追加するリンク 1</a>
            <a href="#" class="sidebar-link">あとで追加するリンク 2</a>
            <a href="#" class="sidebar-link">あとで追加するリンク 3</a>
            <a href="#" class="sidebar-link">あとで追加するリンク 4</a>
            <a href="#" class="sidebar-link">あとで追加するリンク 5</a>
          </div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
  <button id="menuToggle" class="menu-btn" type="button" aria-label="メニュー切替">
    <span class="hamburger">☰</span>
  </button>

  <div class="topbar-title">A beef 社内ポータル</div>

  <div class="topbar-links">
    <a href="#" class="top-link">
      <span class="icon">🏢</span>
      <span class="label">会社紹介</span>
    </a>
    <a href="#" class="top-link">
      <span class="icon">💴</span>
      <span class="label">コース・料金</span>
    </a>
    <a href="#" class="top-link">
      <span class="icon">👤</span>
      <span class="label">講師一覧</span>
    </a>
  </div>
</header>
     

      <div class="container">
        <section class="news-section">
          <h2 class="section-title">新着状況</h2>
          <div class="news-panel">
            <div class="news-main">
              <div class="news-list" id="newsList"></div>
            </div>

            <aside class="news-side">
              <div class="side-box">総合カレンダー</div>
              <div class="side-box">E-LEARNING</div>
              <div class="side-box">年間スケジュール</div>
              <div class="side-box">ダウンロード書類</div>
              <div class="side-box">保護者向け案内</div>
            </aside>
          </div>
        </section>

        <section class="portal">
          <h2 class="section-title">マニュアル</h2>
          <div class="cards" id="cardGrid"></div>
        </section>
      </div>
    </div>
  </div>

  <script>
    const cards = [
      {
        title: "お客様対応関連",
        text: "顧客とのメール対応、問い合わせ管理、連絡履歴の確認はこちらから。",
        icon: "📞",
        href: "#",
        color: "c-teal"
      },
      {
        title: "経理関連",
        text: "経費精算、請求書管理、支払い処理など経理業務はこちら。",
        icon: "💰",
        href: "#",
        color: "c-coral"
      },
      {
        title: "社内業務関連",
        text: "社内申請、勤怠、備品管理など日常業務の入口です。",
        icon: "🏢",
        href: "#",
        color: "c-yellow"
      },
      {
        title: "お客様提供物関連",
        text: "納品資料、提出物、成果物の管理・確認はこちら。",
        icon: "📦",
        href: "#",
        color: "c-blue"
      },
      {
        title: "マーケ関連",
        text: "広告運用、分析データ、マーケ施策の管理はこちら。",
        icon: "📊",
        href: "#",
        color: "c-purple"
      },
      {
        title: "FAQ",
        text: "社内ルールやよくある質問をまとめています。",
        icon: "❓",
        href: "#",
        color: "c-green"
      }
    ];

    const newsData = [
      { date: "2026.05.30", title: "「6月のスケジュールについて」を更新しました。", isNew: true },
      { date: "2026.05.28", title: "「経費精算のルール」を更新しました。", isNew: true },
      { date: "2026.05.26", title: "「社内FAQ」を更新しました。", isNew: false },
      { date: "2026.05.25", title: "「勤怠システムのお知らせ」を掲載しました。", isNew: false },
      { date: "2026.05.22", title: "「新規プロジェクト情報」を追加しました。", isNew: true }
    ];

    const searchLinks = [
      {
        category: "お客様連絡関連",
        title: "問い合わせ対応一覧",
        description: "お客様からの問い合わせ内容と対応状況を確認します。",
        keywords: ["問い合わせ", "顧客連絡", "対応履歴", "メール"],
        url: "#"
      },
      {
        category: "経理関連",
        title: "請求書管理",
        description: "請求書の作成、確認、送付履歴を管理します。",
        keywords: ["請求書", "経理", "支払い", "入金"],
        url: "#"
      },
      {
        category: "社内業務関連",
        title: "勤怠・申請ポータル",
        description: "勤怠修正、休暇申請、各種社内申請はこちらです。",
        keywords: ["勤怠", "申請", "休暇", "社内業務"],
        url: "#"
      },
      {
        category: "お客様提供物関連",
        title: "納品データ一覧",
        description: "お客様へ提出する資料や納品データを確認します。",
        keywords: ["納品", "提出物", "成果物", "提供物"],
        url: "#"
      },
      {
        category: "マーケティング関連",
        title: "広告運用ダッシュボード",
        description: "広告配信状況、施策結果、レポートをまとめています。",
        keywords: ["広告", "マーケティング", "分析", "レポート"],
        url: "#"
      },
      {
        category: "FAQ",
        title: "社内FAQ集",
        description: "よくある質問と回答、社内ルールの確認はこちらです。",
        keywords: ["FAQ", "ルール", "手続き", "質問"],
        url: "#"
      }
    ];

    const cardGrid = document.getElementById("cardGrid");
    const newsList = document.getElementById("newsList");
    const portalSearch = document.getElementById("portalSearch");
    const clearSearch = document.getElementById("clearSearch");
    const searchResults = document.getElementById("searchResults");
    const menuToggle = document.getElementById("menuToggle");
    const sidebar = document.getElementById("sidebar");

   cards.forEach((card) => {
  const linkCard = document.createElement("a");
  linkCard.className = `card ${card.color}`;
  linkCard.href = card.href;
  linkCard.innerHTML = `
    <div class="card-content">
      <div class="card-icon">${card.icon}</div>
      <div class="card-text">
        <h3>${card.title}</h3>
        <p>${card.text}</p>
      </div>
    </div>
  `;
  cardGrid.appendChild(linkCard);
});

    newsData.forEach((item) => {
      const div = document.createElement("div");
      div.className = "news-item";
      div.innerHTML = `
        <div class="news-date">${item.date}</div>
        <div class="news-title">
          ${item.title}
          ${item.isNew ? '<span class="news-tag">NEW</span>' : ""}
        </div>
      `;
      newsList.appendChild(div);
    });

    function renderSearchResults(keyword = "") {
      const q = keyword.trim().toLowerCase();

      if (!q) {
        searchResults.textContent = "　";
        return;
      }

      const matched = searchLinks.filter((item) => {
        const text = [
          item.category,
          item.title,
          item.description,
          ...(item.keywords || [])
        ].join(" ").toLowerCase();

        return text.includes(q);
      });

      if (!matched.length) {
        searchResults.textContent = `「${keyword}」に該当するリンクは見つかりませんでした。`;
        return;
      }

      searchResults.innerHTML = `
        <div class="search-result-list">
          ${matched.map((item) => `
            <div class="search-result-item">
              <a href="${item.url}">${item.title}</a>
              <p>${item.category}｜${item.description}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    portalSearch.addEventListener("input", (e) => {
      renderSearchResults(e.target.value);
    });

    clearSearch.addEventListener("click", () => {
      portalSearch.value = "";
      renderSearchResults("");
      portalSearch.focus();
    });

    menuToggle.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });

    renderSearchResults("");
    const sideBoxes = document.querySelectorAll(".side-box");

// 初期選択（1個目を選択状態にする）
sideBoxes[0].classList.add("active");

sideBoxes.forEach((box) => {
  box.addEventListener("click", () => {
