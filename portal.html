<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <title>abeefポータル</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-blue: #35a5db;
      --header-blue-dark: #2f9ed3;
      --deep-blue: #1651a8;
      --bg: #eef3f7;
      --text: #2d3a45;
      --sidebar-bg: #f5f7fa;
      --sidebar-border: #d4dee7;
      --card-shadow: 0 10px 18px rgba(31, 54, 74, 0.14);
    }

    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    /* ===== サイドバー ===== */
    .sidebar {
      width: 230px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      transition: width 0.28s ease, transform 0.28s ease;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar.collapsed {
      width: 0;
      border-right: none;
    }

    .sidebar-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .sidebar-top {
      height: 50px;
      background: linear-gradient(90deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.15);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .sidebar-inner {
      padding: 24px 12px 16px;
      overflow-y: auto;
    }

    .sidebar-search-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #32506c;
      margin-bottom: 8px;
    }

    .sidebar-search-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .sidebar-search-box input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 13px;
      border-radius: 12px;
      border: 2px solid #dfa400;
      outline: none;
      background: #fff;
      color: #475864;
    }

    .sidebar-search-box button {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(180deg, #25a4b0 0%, #1f95a1 100%);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow:
        0 5px 12px rgba(18, 92, 100, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .sidebar-search-results {
      min-height: 24px;
      font-size: 12px;
      line-height: 1.6;
      color: #4a6075;
      margin-bottom: 16px;
    }

.sidebar-link-group {
  margin-bottom: 14px; /* ← カテゴリ同士の間 */
}

.sidebar-link-category {
  margin: 16px 0 8px; /* ← 上を広く、下は少しだけ */
  font-size: 12px;
  color: #70808d;
  font-weight: 700;
}

.sidebar-links {
  display: grid;
  gap: 10px; /* ← リンク同士の間 */
}
    .search-result-list {
      display: grid;
      gap: 8px;
    }

    .search-result-item {
      background: #eaf4fb;
      border: 1px solid #cfe0ed;
      border-radius: 10px;
      padding: 10px 11px;
    }

    .search-result-item a {
      color: var(--deep-blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      word-break: break-word;
    }

    .search-result-item p {
      margin: 5px 0 0;
      font-size: 11px;
      line-height: 1.5;
      color: #557086;
      word-break: break-word;
    }

    .sidebar-links-title {
      margin: 0 0 10px;
    }

    /* 見出しを統一 */
.sidebar-search-label,
.sidebar-links-title {
  font-size: 13px;
  font-weight: 700;
  color: #32506c;
}

    .sidebar-links {
      display: grid;
      gap: 8px;
    }

    .sidebar-link {
      display: block;
      padding: 10px 10px;
      border-radius: 10px;
      background: #fff;
      border: 1px solid #d7e1ea;
      color: #385069;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.5;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
      word-break: break-word;
    }

    .sidebar-link:hover {
      background: #f0f7fc;
    }

    /* ===== メイン ===== */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

.topbar {
  height: 50px;
  background: linear-gradient(90deg, var(--header-blue) 0%, var(--header-blue-dark) 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: flex-start; /* ← ここを変更 */
  padding: 0 18px;
  gap: 14px;
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.18);
}
    
.topbar {
  justify-content: space-between;
}

/* 右側リンク全体 */
.topbar-links {
  display: flex;
  gap: 18px;
  align-items: center;
  margin-left: auto;
}

/* 各ボタン */
.top-link {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 10px;
  transition: 0.2s;
}

/* アイコン */
.top-link .icon {
  font-size: 25px;
  margin-bottom: 2px;
}

/* ホバー */
.top-link:hover {
  background: rgba(255,255,255,0.15);
}
    
    .menu-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .menu-btn:hover {
      background: rgba(255,255,255,0.12);
    }

    .hamburger {
      font-size: 30px;
      line-height: 1;
      font-weight: 700;
    }

    .topbar-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .container {
      width: min(94%, 1220px);
      margin: 25px auto 28px;
    }

    /* ===== 新着 ===== */
    .news-section {
      padding: 0;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.2;
      color: #6d7784;
      font-weight: 700;
    }

    .news-panel {
      display: grid;
      grid-template-columns: 4fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .news-main {
  background: #fff;
  border: 1px solid #cfd8df;
  height: 446px; /* 248px × 1.8 の目安 */
  padding: 8px 14px 10px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  border-radius: 14px;
  overflow-y: auto;
}

    .news-list {
      display: grid;
    }

    .news-item {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 14px;
  align-items: center;
  height: 48px;
  padding: 0 6px;
  border-bottom: 1px solid #d9e0e6;
  font-size: 14px;
}

    .news-item:last-child {
      border-bottom: none;
    }

    .news-date {
      color: #81909d;
      font-weight: 500;
    }

    .news-title {
  color: #334150;
  line-height: 1.45;
  overflow: hidden;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

    .news-tag {
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #d3302f;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      vertical-align: middle;
    }

    .news-side {
      display: grid;
      gap: 10px;
    }

.side-box {
  min-height: auto;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #f7fafc 0%, #eef3f8 100%);
  border: 1px solid #ccd7e3;
  color: #46576a;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  box-shadow:
    0 1px 2px rgba(31, 54, 74, 0.04),
    inset 0 1px 0 rgba(255,255,255,0.8);
  padding: 10px 12px;
  border-radius: 12px;
}
.side-box {
  transition: all 0.2s ease;
  cursor: pointer;
}

.side-box:hover {
  transform: translateY(-3px);
  background: linear-gradient(180deg, #ffffff 0%, #e6edf5 100%);
  box-shadow:
    0 6px 14px rgba(31, 54, 74, 0.18),
    inset 0 1px 0 rgba(255,255,255,0.9);
}
    
    /* ===== カード ===== */
    .portal {
      padding: 24px 0 0;
    }

    .portal .section-title {
      margin: 0 0 18px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 26px;
    }

    .card {
  position: relative;
  display: block;
  text-decoration: none;
  min-height: 96px;
  padding: 16px 18px 26px;
  color: #fff;
  overflow: hidden;
  clip-path: polygon(0 0, 100% 0, 100% 80%, 95% 100%, 0 100%);
  box-shadow: var(--card-shadow);
  border-radius: 12px;
}

    .card:hover {
  transform: translateY(-2px);
  transition: 0.2s ease;
}

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(255,255,255,0.10) 0%,
        rgba(255,255,255,0.02) 45%,
        rgba(0,0,0,0.06) 100%
      );
      pointer-events: none;
    }

    .card::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 12px;
  background: rgba(0,0,0,0.12);
}
    .card-content {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  position: relative;
  z-index: 1;
}
    .card-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: rgba(0,0,0,0.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  flex-shrink: 0;
}

    .card-text {
      min-width: 0;
      flex: 1;
    }

    .card h3 {
  margin: 0 0 6px;
  font-size: 20px;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
   .card p {
  margin: 0;
  font-size: 11px;
  line-height: 1.55;
  color: rgba(255,255,255,0.96);
}

    .card-link {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 22px;
      display: grid;
      place-items: center;
      z-index: 1;
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .c-teal   { background: linear-gradient(135deg, #45c3c8 0%, #2aa8ab 100%); }
    .c-coral  { background: linear-gradient(135deg, #f39a8d 0%, #e87469 100%); }
    .c-yellow { background: linear-gradient(135deg, #eccb42 0%, #d7aa1f 100%); }
    .c-blue   { background: linear-gradient(135deg, #7bb0e1 0%, #5f92c6 100%); }
    .c-purple { background: linear-gradient(135deg, #b589d7 0%, #9a6dc2 100%); }
    .c-green  { background: linear-gradient(135deg, #9dd45f 0%, #7dbb43 100%); }

    @media (max-width: 1100px) {
      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 920px) {
      .news-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .app {
        position: relative;
      }

      .sidebar {
        position: fixed;
        top: 72px;
        left: 0;
        bottom: 0;
        z-index: 30;
        width: 230px;
        box-shadow: 8px 0 20px rgba(0,0,0,0.12);
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
        width: 230px;
      }

      .container {
        width: 94%;
      }

      .news-item {
        grid-template-columns: 1fr;
        gap: 6px;
        font-size: 13px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 150px;
      }
    }
    .side-box.active {
  background: linear-gradient(180deg, #35a5db 0%, #2f9ed3 100%);
  color: #fff;
  box-shadow:
    0 6px 14px rgba(31, 54, 74, 0.25),
    inset 0 1px 0 rgba(255,255,255,0.3);
}
        /* ===== パスワードモーダル ===== */
    .password-modal.hidden {
      display: none;
    }

    .password-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
    }

    .password-modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    .password-modal-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92%, 420px);
      background: #fff;
      border-radius: 16px;
      padding: 22px 20px 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.22);
      border: 1px solid #d8e0e8;
    }

    .password-modal-content h3 {
      margin: 0 0 10px;
      font-size: 20px;
      color: #2d3a45;
    }

    .password-modal-text {
      margin: 0 0 14px;
      font-size: 14px;
      color: #5b6b78;
      line-height: 1.6;
    }

    .password-input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #cfd8df;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }

    .password-input:focus {
      border-color: #35a5db;
      box-shadow: 0 0 0 3px rgba(53, 165, 219, 0.15);
    }

    .password-error {
      min-height: 20px;
      margin: 10px 0 0;
      font-size: 13px;
      color: #d3302f;
      font-weight: 700;
    }

    .password-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 14px;
    }

    .password-btn {
      min-width: 90px;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .password-btn.cancel {
      background: #e8edf2;
      color: #44515d;
    }

    .password-btn.submit {
      background: linear-gradient(180deg, #35a5db 0%, #2f9ed3 100%);
      color: #fff;
    }
  </style>
</head>

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, function (m) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[m];
  });
}

  });

  if (!matchedStaticLinks.length && !matchedSidebarLinks.length && !matchedManuals.length) {
    searchResults.textContent = `「${keyword}」に該当する結果は見つかりませんでした。`;
    return;
  }

  let html = `<div class="search-result-list">`;

  if (matchedManuals.length) {
    

    html += matchedManuals.map((item) => {
      const separator = item.url.includes("?") ? "&" : "?";
      const urlWithQuery = `${item.url}${separator}q=${encodeURIComponent(keyword)}`;

      return `
        <div class="search-result-item">
          <a href="${urlWithQuery}" target="_blank" rel="noopener noreferrer">
            ${escapeHtml(item.title)}
          </a>
          <p>本文に「${escapeHtml(keyword)}」が含まれています</p>
        </div>
      `;
    }).join("");
  }

  if (matchedStaticLinks.length || matchedSidebarLinks.length) {

  html += matchedSidebarLinks.map((item) => `
    <div class="search-result-item">
      <a href="${item.url}" target="_blank" rel="noopener noreferrer">
        ${escapeHtml(item.title)}
      </a>
      <p>${escapeHtml(item.category)}</p>
    </div>
  `).join("");

  html += matchedStaticLinks.map((item) => `
    <div class="search-result-item">
      <a href="${item.url}" target="_blank" rel="noopener noreferrer">
        ${escapeHtml(item.title)}
      </a>
      <p>${escapeHtml(item.category)}｜${escapeHtml(item.description)}</p>
    </div>
  `).join("");
}

  html += `</div>`;
  searchResults.innerHTML = html;
}

let currentCategory = "";

    function renderSidebarLinks(rows) {
  sidebarLinksArea.innerHTML = `<h3 class="sidebar-links-title">リンク一覧</h3>`;

  let groupDiv = null;

  rows.slice(1).forEach(row => {
    const category = row.c[0]?.v || "";

    const url = row.c[2]?.v || "";

      links.className = "sidebar-links";

      groupDiv.appendChild(title);

      sidebarLinksArea.appendChild(groupDiv);
    }

    // リンク行
    if (name && url && groupDiv) {
      const link = document.createElement("a");
      link.className = "sidebar-link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = name;

      groupDiv.querySelector(".sidebar-links").appendChild(link);
    }
  });
}
